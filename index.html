<style>
/* Arc: una columna (máx. 760px), oscura y minimalista, acento menta. Pensada primero para el móvil. */
:root{
  --bg:#050505;--surface:#0F1110;--surface2:#151816;--sunk:#0A0B0A;--line:#222624;--line2:#2D322F;
  --ink:#F1F4F2;--muted:#8D9590;--faint:#5B625E;
  --accent:#2EE6A6;--accent-ink:#04140D;--accent-soft:rgba(46,230,166,.12);--glow:0 0 24px rgba(46,230,166,.22);
  --warn:#F2B544;--warn-soft:rgba(242,181,68,.12);--crit:#FF6B6B;--crit-soft:rgba(255,107,107,.12);
  --r:16px;--font:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;--head:'Archivo','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(32px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:rgba(5,5,5,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.brand{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--head);font-weight:800;letter-spacing:.18em;font-size:14px}
.logo svg{width:26px;height:26px}
.who{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:10px 8px 12px;color:var(--muted);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.hero{padding:22px 0 6px}
.kicker{font-family:var(--head);font-weight:700;letter-spacing:.16em;font-size:11.5px;color:var(--muted);text-transform:uppercase}
.slogan{font-family:var(--head);font-weight:900;font-size:clamp(34px,9vw,52px);line-height:.98;letter-spacing:-.01em;margin:10px 0 0;text-transform:uppercase}
.slogan span{display:block;color:var(--accent);text-shadow:0 0 22px rgba(46,230,166,.25)}
.dateline{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted);font-size:13.5px;margin:16px 0 4px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.sync[data-s=db] i{background:var(--accent);box-shadow:var(--glow)}
.sync[data-s=error] i{background:var(--crit)}
main{display:flex;flex-direction:column;gap:14px;padding-top:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.glow{border-color:rgba(46,230,166,.35);box-shadow:inset 0 0 0 1px rgba(46,230,166,.06),0 0 40px rgba(46,230,166,.06)}
.card h2{font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:22px;letter-spacing:.01em;margin:4px 0 12px;line-height:1.05}
.card h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:11px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:var(--glow)}
.btn.ghost{background:none}
.btn.danger{color:var(--crit);border-color:rgba(255,107,107,.4)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.chip.ok{color:var(--accent);border-color:rgba(46,230,166,.45);background:var(--accent-soft)}
.chip.warn{color:var(--warn);border-color:rgba(242,181,68,.45);background:var(--warn-soft)}
.chip.crit{color:var(--crit);border-color:rgba(255,107,107,.45);background:var(--crit-soft)}
.big{font-family:var(--head);font-weight:900;font-size:56px;line-height:.9;letter-spacing:-.02em}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;box-shadow:var(--glow)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-family:var(--head);font-size:24px;font-weight:800}
.kpi span{font-size:12px;color:var(--muted)}
.hab{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.hab:first-child{border-top:0}
.hab .info{flex:1;min-width:0}
.hab .name{font-weight:700}
.hab .det{color:var(--muted);font-size:13px}
.hab .cnt{font-size:12.5px;font-weight:600;color:var(--accent)}
.hab .cnt.low{color:var(--muted)}
.dot{width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);background:none;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--accent-ink);font-weight:800;font-size:14px}
.dot[data-st=done]{background:var(--accent);border-color:var(--accent);box-shadow:var(--glow)}
.dot[data-st=partial]{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
.dot[data-st=auto]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot.sm{width:28px;height:28px;border-width:1.5px;font-size:11px}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
details.extras>summary{cursor:pointer;list-style:none;color:var(--muted);font-weight:600;padding:10px 0;border-top:1px solid var(--line)}
details.extras>summary::-webkit-details-marker{display:none}
details.extras>summary::before{content:'+ ';color:var(--accent)}
details.extras[open]>summary::before{content:'− '}
.scale{display:flex;gap:6px}
.scale button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--sunk);cursor:pointer;font-weight:700}
.scale button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],select,textarea{background:var(--sunk);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;color-scheme:dark}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:600}
label.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.grid{width:100%;border-collapse:collapse;font-size:13px}
.grid th{color:var(--muted);font-weight:600;font-size:11.5px;padding:4px 2px;text-align:center}
.grid th:first-child{text-align:left}
.grid td{padding:6px 1px;text-align:center;border-top:1px solid var(--line)}
.grid td:first-child{text-align:left;width:88px;max-width:88px;padding-right:4px}
.grid td:last-child,.grid th:last-child{width:34px;font-size:12px}
.grid td.today,.grid th.today{background:rgba(46,230,166,.05)}
.grid .hn{font-weight:700;font-size:13px;line-height:1.2}
.grid .ht{color:var(--muted);font-size:11.5px}
.grid .sep td{color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding-top:14px;text-align:left}
.cell{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);background:none;cursor:pointer;color:var(--accent);font-size:10px;font-weight:800}
.cell[data-st=done]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cell[data-st=partial]{background:linear-gradient(90deg,var(--accent) 50%,transparent 50%);border-color:var(--accent)}
.cell[data-st=auto]{background:var(--accent-soft);border-color:var(--accent)}
.cell.off{opacity:.35}
.cell:disabled{cursor:default}
.ms{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.ms input{width:18px;height:18px;accent-color:var(--accent);margin-top:2px;flex:none}
.ms .t{flex:1}
.ms.done .t{color:var(--muted);text-decoration:line-through}
.ms .due{font-size:12px;color:var(--muted);white-space:nowrap}
.ms .due.late{color:var(--warn)}
.task{display:flex;align-items:center;gap:10px;padding:7px 0}
.task input{width:18px;height:18px;accent-color:var(--accent)}
.task.done span{color:var(--muted);text-decoration:line-through}
.task span{flex:1;cursor:pointer}
.alert{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:8px;font-size:13.5px}
.alert.ok{border-color:var(--accent);background:var(--accent-soft)}
.alert.crit{border-color:var(--crit);background:var(--crit-soft)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--font)}
.rank{display:grid;grid-template-columns:1fr 110px 48px 54px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
.rank:first-child{border-top:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);border:1px solid var(--line2);border-bottom:0;border-radius:20px 20px 0 0;width:100%;max-width:760px;max-height:88vh;overflow:auto;padding:18px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{font-family:var(--head);font-weight:900;text-transform:uppercase;font-size:20px;margin:0 0 14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--surface2);border:1px solid var(--accent);color:var(--ink);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw;box-shadow:var(--glow)}
footer{color:var(--faint);font-size:12px;text-align:center;padding:26px 0 8px}
.week-nav{display:flex;align-items:center;gap:8px}
.badge{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--sunk)}
.badge.off{opacity:.45}
.badge b{font-size:13.5px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.q{margin:0 0 4px;font-weight:600;font-size:14px}
.auto{font-size:12.5px;color:var(--accent);margin:0 0 6px}
@media (min-width:640px){.slogan{font-size:56px}.hab .dot{width:44px;height:44px}}
</style>
</head>

    <div class="who"><span>Privado · Jaume</span><button class="iconbtn" data-act="settings" aria-label="Ajustes" title="Ajustes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>

<script>
'use strict';
/* =========================================================
   Arc · objetivos grandes + hábitos + semanas ganadas
   Datos: Supabase (tabla arc_items, mismo proyecto y cuenta que el Cuaderno).
   Del Cuaderno solo se LEEN las tablas logs y settings para el hábito Entreno.
   ========================================================= */

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return isoOf(d); };
const diff = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const dowOf = s => parse(s).getDay();               // 0 = domingo
const monOf = s => add(s, -((dowOf(s) + 6) % 7));   // lunes de esa semana
const today = () => isoOf(new Date());
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const DL = ['L','M','X','J','V','S','D'];
const fD = s => `${+s.slice(8)} ${MES[+s.slice(5, 7) - 1]}`;
const fDY = s => `${fD(s)} ${s.slice(0, 4)}`;
const fLong = s => `${DIA[dowOf(s)]}, ${+s.slice(8)} de ${MESL[+s.slice(5, 7) - 1]}`;
const num = (n, d = 1) => n == null || isNaN(n) ? '—' : Number(n).toLocaleString('es-ES', {maximumFractionDigits: d});
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id' + Date.now() + Math.random().toString(16).slice(2));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const sum = a => a.reduce((x, y) => x + y, 0);
const avg = a => a.length ? sum(a) / a.length : null;

/* ---------- Capítulos (arcos) y textos de cabecera ---------- */
const ARCS = [
  {id:'winter', name:'Winter Arc', from:'2026-10-01', to:'2026-12-31'},
  {id:'maraton', name:'Arco Maratón', from:'2027-01-01', to:'2027-03-14'},
  {id:'grado', name:'Arco Grado', from:'2027-03-15', to:'2027-06-30'},
  {id:'verano', name:'Arco Verano', from:'2027-07-01', to:'2027-09-14'},
  {id:'tri', name:'Arco 70.3', from:'2027-09-15', to:'2028-05-31'},
];
const ARC_START = '2026-09-28'; // primer lunes del Winter Arc
const SLOGANS = {hoy:['Un día.','Un paso.'], habitos:['Tu constancia.','A tu ritmo.'], tareas:['Menos ruido.','Más acción.'], objetivos:['Una dirección.','Pasos concretos.'], stats:['Mira atrás.','Ajusta y sigue.'], analisis:['Tus datos.','Tus respuestas.'], ajustes:['Tu sistema.','Tus reglas.']};
const arcOf = d => ARCS.find(a => d >= a.from && d <= a.to) || ARCS[ARCS.length - 1];

/* ---------- Cuaderno Barcelona 2027 (solo lectura) ---------- */
const CU_START = '2026-09-14', CU_WEEKS = 26;
const CU_SLOTS = [[0,'gym'],[1,'run'],[2,'gym'],[3,'run'],[4,'gym'],[6,'run']];
let CU_PLAN = null;
function cuPlan() {
  if (CU_PLAN && CU_PLAN.moves === S.cu.moves) return CU_PLAN.list;
  const list = [];
  for (let w = 1; w <= CU_WEEKS; w++) {
    const start = add(CU_START, (w - 1) * 7);
    for (const [d, kind] of CU_SLOTS) {
      const date = add(start, d), key = date + '-' + ((w - 1) * 7 + d);
      list.push({key, kind, w, date: (S.cu.moves && S.cu.moves[key]) || date});
    }
  }
  CU_PLAN = {moves: S.cu.moves, list};
  return list;
}
const cuDone = l => l && (l.result === 'success' || l.result === 'adapted');
function cuDay(date) {
  const planned = cuPlan().filter(s => s.date === date);
  const done = planned.filter(s => cuDone(S.cu.logs[s.key]));
  return {planned, done, missed: planned.filter(s => S.cu.logs[s.key] && S.cu.logs[s.key].result === 'missed')};
}
function cuWeek(mon) {
  const end = add(mon, 6), ss = cuPlan().filter(s => s.date >= mon && s.date <= end);
  let km = 0, runs = 0, gym = 0, done = 0;
  ss.forEach(s => { const l = S.cu.logs[s.key]; if (!cuDone(l)) return; done++; if (s.kind === 'run') { runs++; km += +l.actualKm || 0; } else gym++; });
  return {planned: ss.length, done, km, runs, gym, w: ss.length ? ss[0].w : null};
}

/* ---------- Estado ---------- */
const KINDS = ['habit','log','goal','task','mood','review','meta'];
const S = {items: {}, cu: {logs: {}, moves: {}, ok: false}, mode: 'loading', tab: 'hoy', date: today(), week: monOf(today()), statsWeek: monOf(today())};
KINDS.forEach(k => S.items[k] = {});
try { const t = localStorage.getItem('arc-tab'); if (t && SLOGANS[t]) S.tab = t; } catch (e) {}
if (location.hash && SLOGANS[location.hash.slice(1)]) S.tab = location.hash.slice(1);
const CFG = window.ARC_CONFIG || {};
const LOCAL = /[?&]local\b/.test(location.search) || !CFG.supabaseUrl || !window.supabase;
let SB = null, USER = null, channel = null;

/* ---------- Almacenamiento ---------- */
const pending = new Map(); let flushT = null;
function put(kind, id, body) {
  S.items[kind][id] = body;
  if (LOCAL) { saveLocal(); return; }
  pending.set(kind + '\u0000' + id, {kind, id, body, del: false});
  clearTimeout(flushT); flushT = setTimeout(flush, 350);
}
function del(kind, id) {
  delete S.items[kind][id];
  if (LOCAL) { saveLocal(); return; }
  pending.set(kind + '\u0000' + id, {kind, id, del: true});
  clearTimeout(flushT); flushT = setTimeout(flush, 350);
}
async function flush() {
  const ops = [...pending.values()]; pending.clear();
  const ups = ops.filter(o => !o.del).map(o => ({user_id: USER.id, kind: o.kind, id: o.id, body: o.body, updated_at: new Date().toISOString()}));
  try {
    for (let i = 0; i < ups.length; i += 300) { const {error} = await SB.from('arc_items').upsert(ups.slice(i, i + 300)); if (error) throw error; }
    for (const o of ops.filter(o => o.del)) { const {error} = await SB.from('arc_items').delete().eq('user_id', USER.id).eq('kind', o.kind).eq('id', o.id); if (error) throw error; }
    cacheSave(); setSync('db');
  } catch (e) { console.error(e); setSync('error'); toast('No se ha podido guardar. Revisa la conexión; lo reintento al volver.'); ops.forEach(o => pending.set(o.kind + '\u0000' + o.id, o)); }
}

function cacheLoad() { try { const d = JSON.parse(localStorage.getItem(cacheKey()) || 'null'); if (d) { KINDS.forEach(k => S.items[k] = (d.items || {})[k] || {}); if (d.cu) S.cu = d.cu; } } catch (e) {} }

async function loadAll() {
  const items = {}; KINDS.forEach(k => items[k] = {});
  let from = 0;
  for (;;) {
    const {data, error} = await SB.from('arc_items').select('kind,id,body').range(from, from + 999);
    if (error) { if (/arc_items/.test(error.message || '') || error.code === '42P01' || error.code === 'PGRST205') { S.mode = 'schema'; render(); return; } throw error; }
    (data || []).forEach(r => { if (items[r.kind]) items[r.kind][r.id] = r.body; });
    if (!data || data.length < 1000) break; from += 1000;
  }
  S.items = items;
  try {
    const [l, s] = await Promise.all([SB.from('logs').select('key,data'), SB.from('settings').select('data').maybeSingle()]);
    if (l.error) throw l.error;
    const logs = {}; (l.data || []).forEach(r => logs[r.key] = r.data);
    S.cu = {logs, moves: (s.data && s.data.data && s.data.data.moves) || {}, ok: true};
  } catch (e) { S.cu.ok = false; }
  S.mode = 'db'; cacheSave(); setSync('db'); upgrade(); render();
}

  cacheLoad(); S.mode = Object.keys(S.items.habit).length ? 'db' : 'loading'; setSync('loading'); render();

/* ---------- Importar desde Winter Arc ---------- */
function parseWinter(text) {
  let d = JSON.parse(text.trim());
  if (typeof d === 'string') d = JSON.parse(d);
  const arr = Array.isArray(d) ? d : d.records || [];
  return arr.map(r => ({kind: r.kind || r.k, id: r.id, body: r.body || r.b})).filter(r => r.kind && r.body);
}
function winterToArc(recs, base) {
  const out = new Map(base.map(([k, id, b]) => [k + '|' + id, [k, id, b]]));
  const get = (k, id) => out.get(k + '|' + id);
  const set = (k, id, b) => out.set(k + '|' + id, [k, id, b]);
  const coreIds = new Set(SEED_HABITS.filter(h => h.core).map(h => h.id));
  let nH = 0, nL = 0, nM = 0, nT = 0, nG = 0;
  recs.filter(r => r.kind === 'habits').forEach(r => {
    const vs = r.body.versions || [], v = vs[vs.length - 1] || {};
    if (r.id === 'run' || r.id === 'strength') return;
    const first = vs[0] && vs[0].from || '2026-10-01';
    if (coreIds.has(r.id)) { const cur = get('habit', r.id); if (cur) cur[2].from = first; nH++; return; }
    const cur = get('habit', r.id);
    const b = Object.assign({}, cur ? cur[2] : {order: 30 + nH}, {id: r.id, name: v.name || r.id, detail: v.detail || '', target: v.target || 1, min: v.target || 1,
      freq: v.frequency === 'monthly' ? 'monthly' : 'weekly', days: v.days && v.days.length ? v.days : ALL_DAYS, multi: !!v.multi, core: false, source: 'manual',
      from: first, paused: v.active === false});
    set('habit', r.id, b); nH++;
  });
  recs.filter(r => r.kind === 'logs').forEach(r => {
    const l = r.body; if (!l.date || !l.habitId || l.status === 'pending') return;
    const hid = (l.habitId === 'run' || l.habitId === 'strength') ? 'train' : l.habitId;
    const id = hid + '_' + l.date, cur = get('log', id);
    const st = l.status === 'partial' ? 'partial' : 'done', cnt = Math.max(1, +l.count || 1);
    if (cur && hid === 'train') { cur[2].count = (cur[2].count || 1) + cnt; return; }
    set('log', id, {habit: hid, date: l.date, status: st, count: cnt, note: l.note || ''}); nL++;
  });
  recs.filter(r => r.kind === 'moods').forEach(r => { const m = r.body; if (!m.date) return; set('mood', m.date, {date: m.date, energy: m.energy ?? null, focus: m.focus ?? null, motivation: m.motivation ?? null, minutes: m.minutes ?? null}); nM++; });
  recs.filter(r => r.kind === 'tasks').forEach(r => { const t = r.body; set('task', t.id || r.id, {id: t.id || r.id, date: t.date, title: t.title, done: !!t.done}); nT++; });
  recs.filter(r => r.kind === 'goals').forEach(r => {
    const g = r.body, cur = get('goal', g.id);
    const ms = (g.milestones || []).map(m => ({title: m.title, done: !!m.done, due: m.due || null}));
    if (cur) cur[2].milestones = ms; else set('goal', g.id, {id: g.id, title: g.title, due: g.due, note: g.note || '', milestones: ms, order: 40});
    nG++;
  });
  return {recs: [...out.values()], stats: {nH, nL, nM, nT, nG}};
}

/* ---------- Cálculos de hábitos ---------- */
const habits = () => Object.values(S.items.habit).sort((a, b) => (b.core - a.core) || (a.order || 99) - (b.order || 99) || a.name.localeCompare(b.name));
const activeOn = (h, date) => !h.paused && (!h.from || h.from <= date) && (!h.to || h.to >= date);
const activeIn = (h, mon) => !h.paused && (!h.from || h.from <= add(mon, 6)) && (!h.to || h.to >= mon);
const logOf = (h, date) => S.items.log[h.id + '_' + date];
function manualVal(h, date) { const l = logOf(h, date); if (!l) return 0; if (l.status === 'partial') return .5; return h.multi ? (l.count || 1) : 1; }
function autoVal(h, date) { return h.source === 'cuaderno' && S.cu.ok ? cuDay(date).done.length : 0; }
const dayVal = (h, date) => Math.max(manualVal(h, date), autoVal(h, date));
function dayState(h, date) {
  const l = logOf(h, date), a = autoVal(h, date);
  if (l && l.status === 'done') return 'done'; if (a) return 'auto'; if (l && l.status === 'partial') return 'partial'; return '';
}
function weekCount(h, mon) {
  if (h.freq === 'monthly') { const m = mon.slice(0, 7); let c = 0; for (let d = m + '-01'; d.slice(0, 7) === m; d = add(d, 1)) c += dayVal(h, d); return c; }
  let c = 0; for (let i = 0; i < 7; i++) c += dayVal(h, add(mon, i)); return c;
}
// Días de la semana en que el hábito existe (si empieza o termina a mitad de semana, el mínimo se reparte)
function activeDays(h, mon) { let n = 0; for (let i = 0; i < 7; i++) if (activeOn(h, add(mon, i))) n++; return n; }
function baseMin(h, mon) { return (h.minLoad != null && isLoadWeek(mon)) ? h.minLoad : (h.min || h.target); }
function need(h, mon) { if (h.freq === 'monthly') return h.min || h.target; const n = activeDays(h, mon), b = baseMin(h, mon); return n >= 7 ? b : Math.ceil(b * n / 7); }

/* ---------- Semanas de entrega ----------
   Cada hito marcado como entrega convierte en «semana de entrega» la semana (lunes–domingo)
   que contiene la mayoría de los 7 días previos a la entrega. En esa semana bajan los mínimos
   de los hábitos con «mínimo en semana de entrega» (Formación, Inglés, Lectura). */
function deadlines() { const out = []; goals().forEach(g => (g.milestones || []).forEach((m, i) => { if (m.entrega && m.due && !m.done) out.push({g, m, i}); })); return out.sort((a, b) => a.m.due.localeCompare(b.m.due)); }
function loadMonOf(due) { const start = add(due, -6), m1 = monOf(start), m2 = monOf(due); if (m1 === m2) return m1; return diff(add(m1, 6), start) + 1 >= 4 ? m1 : m2; }
function loadInfo(mon) {
  const L = S.items.meta.load || {}; if ((L.off || []).includes(mon)) return null;
  const items = []; goals().forEach(g => (g.milestones || []).forEach(m => { if (m.entrega && m.due && loadMonOf(m.due) === mon) items.push({g, m}); }));
  if (items.length) return {auto: true, items};
  return (L.on || []).includes(mon) ? {auto: false, items: []} : null;
}
const isLoadWeek = mon => !!loadInfo(mon);
function ideal(h, mon) { if (h.freq === 'monthly') return h.target; const n = activeDays(h, mon); return n >= 7 ? h.target : Math.max(1, Math.round(h.target * n / 7)); }
function evalWeek(mon) {
  const core = habits().filter(h => h.core && activeIn(h, mon) && h.freq !== 'monthly');
  const rows = core.map(h => { const c = weekCount(h, mon), nd = need(h, mon); return {h, c, need: nd, ideal: ideal(h, mon), ok: c >= nd, gap: Math.max(0, nd - c)}; });
  const short = rows.filter(r => !r.ok);
  const joker = short.length === 1 && short[0].gap <= 1;
  const won = rows.length > 0 && (short.length === 0 || joker);
  const score = rows.length ? Math.round(100 * sum(rows.map(r => Math.min(r.c, r.ideal))) / sum(rows.map(r => r.ideal))) : 0;
  const end = add(mon, 6), t = today();
  const state = end < t ? (won ? 'won' : 'lost') : mon > t ? 'future' : (won ? 'won' : 'live');
  return {mon, rows, won, joker: joker && short.length === 1, score, state, okCount: rows.filter(r => r.ok).length};
}
function weeksSoFar() { const out = []; for (let m = ARC_START; m <= monOf(today()); m = add(m, 7)) out.push(m); return out; }
function weekStats() {
  const ws = weeksSoFar().map(evalWeek);
  const past = ws.filter(w => w.state === 'won' || w.state === 'lost');
  // La semana en curso no rompe la racha; si ya está ganada, suma
  let streak = 0; for (let i = ws.length - 1; i >= 0; i--) { const w = ws[i]; if (w.state === 'live') continue; if (w.won) streak++; else break; }
  let best = 0, run = 0; ws.forEach(w => { if (w.won && w.state !== 'live') { run++; best = Math.max(best, run); } else if (w.state === 'lost') run = 0; });
  return {ws, won: ws.filter(w => w.won && w.state !== 'live').length, streak, best, past};
}
function habitStreak(h) {
  if (h.freq === 'monthly') return 0;
  let s = 0, m = monOf(today());
  if (weekCount(h, m) >= need(h, m)) s++;
  for (m = add(m, -7); m >= ARC_START; m = add(m, -7)) { if (!activeIn(h, m)) break; if (weekCount(h, m) >= need(h, m)) s++; else break; }
  return s;
}
// % del ideal cumplido desde que existe el hábito (los días futuros no cuentan)
function habitRate(h) {
  const t = today();
  if (h.freq === 'monthly') {
    const ms = []; for (let m = (h.from || ARC_START).slice(0, 7); m <= t.slice(0, 7); m = add(m + '-28', 7).slice(0, 7)) ms.push(m);
    const v = ms.map(m => Math.min(1, weekCount(h, m + '-01') / h.target)); return v.length ? Math.round(100 * avg(v)) : null;
  }
  const ws = weeksSoFar().filter(m => activeIn(h, m)); if (!ws.length) return null;
  let got = 0, want = 0;
  ws.forEach(m => { let n = 0; for (let i = 0; i < 7; i++) { const d = add(m, i); if (d <= t && activeOn(h, d)) n++; } if (!n) return; const tg = h.target * n / 7; got += Math.min(weekCount(h, m), tg); want += tg; });
  return want ? clamp(Math.round(100 * got / want), 0, 100) : null;
}

const goals = () => Object.values(S.items.goal).sort((a, b) => (a.order || 50) - (b.order || 50) || (a.due || '').localeCompare(b.due || ''));
function goalProgress(g) {
  if (g.metric === 'phone') { const m = phoneMetric(); return m.drop == null ? null : clamp(Math.round(100 * m.drop / 30), 0, 100); }
  const ms = g.milestones || []; return ms.length ? pct(ms.filter(m => m.done).length, ms.length) : (g.done ? 100 : 0);
}
function norte() { const t = today(); return goals().filter(g => g.big && !g.done && (g.due || '9999') >= t).sort((a, b) => a.due.localeCompare(b.due))[0] || null; }
function nextMilestones(n = 3) {
  const out = []; goals().forEach(g => (g.milestones || []).forEach((m, i) => { if (!m.done && m.due) out.push({g, m, i}); }));
  return out.sort((a, b) => a.m.due.localeCompare(b.m.due)).slice(0, n);
}
function phoneMetric() {
  const ms = Object.values(S.items.mood).filter(m => m.minutes != null && m.minutes !== '');
  const base = avg(ms.filter(m => m.date >= '2026-10-01' && m.date <= '2026-10-07').map(m => +m.minutes));
  const recent = ms.filter(m => m.date > '2026-10-07').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 7);
  const cur = recent.length ? avg(recent.map(m => +m.minutes)) : null;
  return {base, cur, n: recent.length, drop: base && cur != null ? Math.round(100 * (base - cur) / base) : null};
}

  }
  const valid = rows.filter(r => r[a.g] != null && r[a.y] != null);
  const gs = [0, 1].map(v => { const ys = valid.filter(r => r[a.g] === v).map(r => r[a.y]); return {label: a.labels[v], n: ys.length, v: ys.length ? avg(ys) : null}; });
  const head = `<div class="spread"><div class="kicker">${esc(a.src)}</div><span class="chip ${valid.length >= 10 ? 'ok' : ''}">n = ${valid.length}</span></div><h3 style="margin:8px 0">${esc(a.title)}</h3>`;
  if (gs.some(g => g.n < 2)) return `<div class="card">${head}<p class="small muted" style="margin:0">Aún no hay datos suficientes en los dos grupos. ${esc(a.need)}</p></div>`;
  const d = gs[1].v - gs[0].v;
  return `<div class="card">${head}${groupChart(gs, a.yl)}<p class="small" style="margin:8px 0 0">${gs[1].label}: <b>${num(gs[1].v, 1)}</b> frente a ${num(gs[0].v, 1)} (${d >= 0 ? '+' : ''}${num(d, 1)}).</p>
    ${valid.length < 10 ? '<p class="tiny muted" style="margin:6px 0 0">Con menos de 10 días es una pista, no una conclusión.</p>' : ''}</div>`;
}
function viewAnalisis() {
  const rows = dailyData();
  const nCu = rows.filter(r => r.sessions).length, nMood = rows.filter(r => r.energy != null || r.focus != null).length;
  return `<div class="card"><div class="kicker">Tu proyecto de deporte y datos</div><h2>¿Cómo afectan el sueño y el móvil a mi entrenamiento?</h2>
      <p class="small muted" style="margin:0">Cruzo tus sesiones del Cuaderno (sueño, VFC, RPE) con tus hábitos y check-ins de Arc. ${nCu} días con sesión y ${nMood} check-ins desde ${fD(rows.length ? rows[0].date : today())}.</p>
      <div class="row" style="margin-top:10px"><button class="btn" data-act="csv">Descargar datos (CSV)</button><span class="tiny muted">Un día por fila, para analizarlo en Python o Excel.</span></div></div>
    ${ANALYSES.map(a => analysisCard(a, rows)).join('')}
    <div class="card"><div class="kicker">Cómo leerlo</div><p class="small" style="margin:0">r va de −1 a 1: cerca de 0 no hay relación; ±0,4 o más empieza a ser interesante. Una correlación no demuestra causa, y con pocos días cambia mucho. Lo que más ayuda: apuntar sueño, VFC y RPE en cada sesión del Cuaderno y el check-in diario aquí.</p></div>`;
}
function downloadCsv() {
  const rows = dailyData(), cols = ['date','sleepH','hrv','rhr','rpe','recovery','km','sessions','energy','focus','motivation','phoneMin','sleepHabit','prevSleepHabit','phoneHabit','readingHabit','coreDone'];
  const csv = [cols.join(',')].concat(rows.map(r => cols.map(c => r[c] == null ? '' : typeof r[c] === 'number' ? Math.round(r[c] * 100) / 100 : r[c]).join(','))).join('\n');
  const u = URL.createObjectURL(new Blob([csv], {type: 'text/csv'})), x = document.createElement('a'); x.href = u; x.download = `arc-datos-${today()}.csv`; x.click(); setTimeout(() => URL.revokeObjectURL(u), 2000);
}

/* ---- Ajustes ---- */

  return `<div class="card stack"><div class="kicker">Cuenta</div><h2>Ajustes</h2>
      <p class="small" style="margin:0">${LOCAL ? 'Modo local: los datos se guardan solo en este navegador.' : `Sesión: <b>${esc(USER && USER.email)}</b>`}</p>
      <p class="small muted" style="margin:0">Cuaderno Barcelona 2027: ${S.cu.ok ? `conectado (${Object.keys(S.cu.logs).length} registros leídos)` : 'no disponible'}.</p>
      <div class="row">${LOCAL ? '' : '<button class="btn" data-act="logout">Cerrar sesión</button>'}<button class="btn" data-act="export">Exportar copia (JSON)</button><button class="btn ghost" data-act="rules">Reglas</button></div></div>
    <div class="card stack"><div class="kicker">Migración</div><h3>Importar desde el Winter Arc</h3>
      <p class="small muted" style="margin:0">Pega el contenido de <a href="https://winter-arc-jaume-2026.jaumesava.chatgpt.site/api/records" target="_blank" rel="noopener">/api/records</a>. Se fusiona con lo que ya tienes, sin borrar nada.</p>
      <textarea id="wa-json2" style="min-height:90px;font-family:ui-monospace,monospace;font-size:12px"></textarea>
      <div class="row"><button class="btn" data-act="import-again">Importar</button><span id="impMsg" class="small"></span></div></div>`;
}
function rulesSheet() {
  openSheet(`<h2>Reglas</h2><div class="stack small">
    <p style="margin:0"><b>Objetivo grande (norte).</b> Arriba de Hoy ves el más cercano con su cuenta atrás. Al cumplirlo, aparece el siguiente.</p>
    <p style="margin:0"><b>Núcleo y extras.</b> Solo los hábitos del núcleo cuentan para ganar la semana. Los extras suman en tus estadísticas pero no restan.</p>
    <p style="margin:0"><b>Ideal y mínimo.</b> Cada hábito del núcleo tiene un ideal (p. ej. 7/semana) y un mínimo (p. ej. 5). La semana se gana si llegas al mínimo en todos.</p>
    <p style="margin:0"><b>Comodín.</b> Si a un solo hábito le falta una vez para el mínimo, la semana cuenta como ganada.</p>
    <p style="margin:0"><b>Rachas.</b> Semanas seguidas cumpliendo el mínimo. La semana en curso no rompe la racha hasta que termina.</p>
    <p style="margin:0"><b>Entreno.</b> Se marca solo con las sesiones hechas o adaptadas del Cuaderno Barcelona 2027. Puedes marcarlo a mano si entrenas fuera del plan.</p>
    <p style="margin:0"><b>Parcial</b> cuenta como media sesión. Los días futuros no restan.</p>
    <div class="row"><button class="btn" data-act="close">Cerrar</button></div></div>`);
}

/* ---------- Hojas (formularios) ---------- */
function openSheet(html) { $('#sheet').innerHTML = `<div class="sheet-bg" data-act="close-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`; }
function closeSheet() { $('#sheet').innerHTML = ''; }
function habitDaySheet(id, date) {
  const h = S.items.habit[id], l = logOf(h, date) || {}, a = autoVal(h, date);
  const cu = h.source === 'cuaderno' && S.cu.ok ? cuDay(date) : null;
  openSheet(`<h2>${esc(h.name)} · ${fD(date)}</h2><form data-form="habit-day" data-h="${esc(id)}" data-d="${date}" class="stack">
    ${cu ? `<div class="alert ok">Cuaderno: ${cu.done.length} sesión(es) hechas de ${cu.planned.length} previstas. ${a ? 'Ya cuenta automáticamente.' : 'Si entrenaste fuera del plan, márcalo aquí.'}</div>` : ''}
    <label class="f">Estado<select name="status"><option value="">Pendiente</option><option value="done" ${l.status === 'done' ? 'selected' : ''}>Hecho</option><option value="partial" ${l.status === 'partial' ? 'selected' : ''}>Parcial</option></select></label>
    ${h.multi || h.source === 'cuaderno' ? `<label class="f">Sesiones o bloques<input type="number" name="count" min="1" max="10" value="${l.count || 1}"></label>` : ''}
    <label class="f">Nota<textarea name="note" rows="2">${esc(l.note || '')}</textarea></label>
    <div class="row"><button class="btn primary">Guardar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button></div></form>`);
}
function habitSheet(id) {
  const h = id ? S.items.habit[id] : {name: '', detail: '', target: 5, min: 4, freq: 'weekly', core: false, days: ALL_DAYS, from: today(), source: 'manual'};
  const gs = goals().filter(g => !g.done);
  openSheet(`<h2>${id ? 'Editar hábito' : 'Nuevo hábito'}</h2><form data-form="habit" data-h="${esc(id || '')}" class="stack">
    <label class="f">Nombre<input type="text" name="name" value="${esc(h.name)}" required></label>
    <label class="f">Detalle<input type="text" name="detail" value="${esc(h.detail || '')}"></label>
    <label class="f">Foco actual (opcional, p. ej. «Curso de Excel»)<input type="text" name="focus" value="${esc(h.focus || '')}"></label>
    <div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1">Frecuencia<select name="freq"><option value="weekly">Semanal</option><option value="monthly" ${h.freq === 'monthly' ? 'selected' : ''}>Mensual</option></select></label>
      <label class="f" style="flex:1">Ideal<input type="number" name="target" min="1" max="31" value="${h.target}"></label>
      <label class="f" style="flex:1">Mínimo<input type="number" name="min" min="0" max="31" value="${h.min ?? h.target}"></label></div>
    <label class="f">Mínimo en semana de entrega (vacío = igual)<input type="number" name="minLoad" min="0" max="31" value="${h.minLoad ?? ''}"></label>
    <label class="chk"><input type="checkbox" name="core" ${h.core ? 'checked' : ''}> Núcleo (cuenta para ganar la semana)</label>
    <label class="f">Objetivo grande al que empuja<select name="goal"><option value="">—</option>${gs.map(g => `<option value="${esc(g.id)}" ${h.goal === g.id ? 'selected' : ''}>${esc(g.title)}</option>`).join('')}</select></label>
    <div class="row" style="flex-wrap:nowrap"><label class="f" style="flex:1">Desde<input type="date" name="from" value="${h.from || ''}"></label><label class="f" style="flex:1">Hasta (opcional)<input type="date" name="to" value="${h.to || ''}"></label></div>
    <label class="chk"><input type="checkbox" name="cuaderno" ${h.source === 'cuaderno' ? 'checked' : ''}> Marcar solo con el Cuaderno Barcelona 2027</label>
    <label class="chk"><input type="checkbox" name="multi" ${h.multi ? 'checked' : ''}> Puede haber varias sesiones al día</label>
    <label class="chk"><input type="checkbox" name="paused" ${h.paused ? 'checked' : ''}> Pausado</label>
    <div class="row"><button class="btn primary">Guardar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button>${id ? '<button class="btn danger" type="button" data-act="habit-del" data-h="' + esc(id) + '">Borrar</button>' : ''}</div>
    <p class="tiny muted" style="margin:0">Para dejarlo atrás sin perder el historial, mejor ponle fecha «Hasta» o páusalo.</p></form>`);
}
function goalSheet(id, big) {
  const g = id ? S.items.goal[id] : {title: '', due: '', why: '', big: !!big, milestones: []};
  const bigs = goals().filter(x => x.big && x.id !== id);
  openSheet(`<h2>${id ? 'Editar' : 'Nuevo'} ${g.big ? 'objetivo grande' : 'meta'}</h2><form data-form="goal" data-g="${esc(id || '')}" class="stack">
    <label class="f">Título<input type="text" name="title" value="${esc(g.title)}" required></label>
    <label class="f">Fecha<input type="date" name="due" value="${g.due || ''}" ${g.big ? 'required' : ''}></label>
    <label class="f">Por qué importa<input type="text" name="why" value="${esc(g.why || '')}"></label>
    <label class="f">Nota<input type="text" name="note" value="${esc(g.note || '')}"></label>
    <label class="chk"><input type="checkbox" name="big" ${g.big ? 'checked' : ''}> Objetivo grande (norte)</label>
    <label class="f">Dentro de<select name="parent"><option value="">—</option>${bigs.map(b => `<option value="${esc(b.id)}" ${g.parent === b.id ? 'selected' : ''}>${esc(b.title)}</option>`).join('')}</select></label>
    ${id ? `<div><div class="small muted" style="margin-bottom:6px">Hitos (uno por línea; fecha al final con | 2027-03-14; añade * al principio si es una entrega)</div><textarea name="ms" rows="6">${esc((g.milestones || []).map(m => (m.entrega ? '* ' : '') + m.title + (m.due ? ' | ' + m.due : '')).join('\n'))}</textarea></div>` : ''}
    <label class="chk"><input type="checkbox" name="done" ${g.done ? 'checked' : ''}> Cumplido</label>
    <div class="row"><button class="btn primary">Guardar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button>${id ? '<button class="btn danger" type="button" data-act="goal-del" data-g="' + esc(id) + '">Borrar</button>' : ''}</div></form>`);
}
function taskSheet(id) {
  const t = S.items.task[id];
  openSheet(`<h2>Tarea</h2><form data-form="task" data-id="${esc(id)}" class="stack">
    <label class="f">Título<input type="text" name="title" value="${esc(t.title)}" required></label>
    <label class="f">Día<input type="date" name="date" value="${t.date}"></label>
    <div class="row"><button class="btn primary">Guardar</button><button class="btn ghost" type="button" data-act="close">Cancelar</button><button class="btn danger" type="button" data-act="task-del" data-id="${esc(id)}">Borrar</button></div></form>`);
}

/* ---------- Acciones ---------- */
function cycle(h, date) {
  // vacío → hecho → parcial → vacío (la nota, si la hay, se conserva)
  const l = logOf(h, date), id = h.id + '_' + date, st = l ? l.status : '';
  if (!st) put('log', id, Object.assign({habit: h.id, date, count: 1, note: ''}, l || {}, {status: 'done'}));
  else if (st === 'done') put('log', id, Object.assign({}, l, {status: 'partial'}));
  else if (l.note) put('log', id, Object.assign({}, l, {status: ''}));
  else del('log', id);
}
document.addEventListener('click', async e => {
  const tabB = e.target.closest('nav.tabs button, [data-tab-go]');
  if (tabB) { S.tab = tabB.dataset.tab || tabB.dataset.tabGo; try { localStorage.setItem('arc-tab', S.tab); } catch (x) {} history.replaceState(null, '', '#' + S.tab); render(); window.scrollTo({top: 0}); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'close-bg') { if (e.target === el) closeSheet(); return; }
  if (el.tagName === 'A' || a !== 'task-toggle' && a !== 'ms-toggle') e.preventDefault();
  const H = S.items.habit, G = S.items.goal;
  switch (a) {
    case 'settings': S.tab = 'ajustes'; render(); window.scrollTo({top: 0}); break;
    case 'rules': rulesSheet(); break;
    case 'close': closeSheet(); break;
    case 'reload': location.reload(); break;
    case 'tap': { const h = H[el.dataset.h]; if (!h) break; const d = el.dataset.d; if (d > today()) break; cycle(h, d); render(); break; }
    case 'habit-day': habitDaySheet(el.dataset.h, el.dataset.d); break;
    case 'habit-new': habitSheet(null); break;
    case 'habit-edit': habitSheet(el.dataset.h); break;
    case 'habit-del': if (confirmTwice(el, 'Pulsa otra vez para borrar el hábito y su historial')) { const id = el.dataset.h; Object.keys(S.items.log).filter(k => S.items.log[k].habit === id).forEach(k => del('log', k)); del('habit', id); closeSheet(); render(); } break;
    case 'day-today': S.date = today(); render(); break;
    case 'week': S.week = add(S.week, 7 * +el.dataset.n); if (S.week > monOf(today()) && S.tab === 'habitos') S.week = monOf(today()); render(); break;
    case 'rweek': S.statsWeek = add(S.statsWeek, 7 * +el.dataset.n); if (S.statsWeek > monOf(today())) S.statsWeek = monOf(today()); render(); break;
    case 'mood': { const d = S.date, m = Object.assign({date: d}, S.items.mood[d] || {}); const k = el.dataset.k, v = +el.dataset.v; m[k] = m[k] === v ? null : v; put('mood', d, m); render(); break; }
    case 'mood-save': { const d = S.date, m = Object.assign({date: d}, S.items.mood[d] || {}); const v = $('#mood-min').value; m.minutes = v === '' ? null : Math.max(0, +v); put('mood', d, m); toast('Guardado.'); render(); break; }
    case 'task-toggle': { const t = S.items.task[el.dataset.id]; put('task', t.id, Object.assign({}, t, {done: el.checked})); render(); break; }
    case 'task-edit': taskSheet(el.dataset.id); break;
    case 'task-del': del('task', el.dataset.id); closeSheet(); render(); break;
    case 'ms-toggle': { const g = JSON.parse(JSON.stringify(G[el.dataset.g])), m = g.milestones[+el.dataset.i]; m.done = el.checked; m.doneAt = el.checked ? today() : null; put('goal', g.id, g); render(); break; }
    case 'ms-add': { const g = JSON.parse(JSON.stringify(G[el.dataset.g])); const title = prompt('Nuevo hito'); if (!title) break; const due = prompt('Fecha (AAAA-MM-DD, opcional)', '') || null; g.milestones = (g.milestones || []).concat([{title, due: /^\d{4}-\d{2}-\d{2}$/.test(due || '') ? due : null, done: false}]); put('goal', g.id, g); render(); break; }
    case 'goal-new': goalSheet(null, el.dataset.big === '1'); break;
    case 'goal-edit': goalSheet(el.dataset.g); break;
    case 'goal-del': if (confirmTwice(el, 'Pulsa otra vez para borrar')) { del('goal', el.dataset.g); closeSheet(); render(); } break;
    case 'logout': await SB.auth.signOut(); break;
    case 'raise-min': habits().filter(h => h.minUp && h.minUp > (h.min || 0)).forEach(h => { const b = Object.assign({}, h, {min: h.minUp}); delete b.minUp; put('habit', h.id, b); }); toast('Mínimos subidos. A por ello.'); render(); break;
    case 'load-toggle': { const mon = el.dataset.m, L = JSON.parse(JSON.stringify(S.items.meta.load || {on: [], off: []})); L.on = L.on || []; L.off = L.off || [];
      const li = loadInfo(mon), auto = (() => { const x = L.off.filter(m => m !== mon); const saved = S.items.meta.load; S.items.meta.load = {on: [], off: x}; const r = loadInfo(mon); S.items.meta.load = saved; return r && r.auto; })();
      if (li) { L.on = L.on.filter(m => m !== mon); if (auto) L.off.push(mon); } else { L.off = L.off.filter(m => m !== mon); if (!auto) L.on.push(mon); }
      put('meta', 'load', L); render(); break; }
    case 'csv': downloadCsv(); break;
    case 'export': { const blob = new Blob([JSON.stringify({exportedAt: new Date().toISOString(), items: S.items}, null, 1)], {type: 'application/json'}); const u = URL.createObjectURL(blob); const x = document.createElement('a'); x.href = u; x.download = `arc-${today()}.json`; x.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); break; }
    case 'setup-import': case 'setup-empty': {
      const msg = $('#setupMsg'); el.disabled = true;
      try {
        let base = seedRecords(today()), stats = null;
        if (a === 'setup-import') { const txt = $('#wa-json').value; if (!txt.trim()) { msg.textContent = 'Pega primero los datos del Winter Arc.'; el.disabled = false; break; } const r = winterToArc(parseWinter(txt), base); base = r.recs; stats = r.stats; }
        msg.textContent = 'Guardando…'; await bulkPut(base);
        toast(stats ? `Importado: ${stats.nL} marcas, ${stats.nM} check-ins, ${stats.nT} tareas, ${stats.nH} hábitos.` : 'Listo. Tu Arc está creado.'); render();
      } catch (err) { console.error(err); msg.textContent = 'No he podido importar: ' + (err.message || err); el.disabled = false; }
      break; }
    case 'import-again': {
      const msg = $('#impMsg');
      try { const cur = KINDS.flatMap(k => Object.entries(S.items[k]).map(([id, b]) => [k, id, JSON.parse(JSON.stringify(b))])); const r = winterToArc(parseWinter($('#wa-json2').value), cur); await bulkPut(r.recs); msg.textContent = `Hecho: ${r.stats.nL} marcas, ${r.stats.nM} check-ins, ${r.stats.nT} tareas.`; }
      catch (err) { msg.textContent = 'Error: ' + (err.message || err); }
      break; }
  }
});
function confirmTwice(el, msg) { if (el.dataset.armed) return true; el.dataset.armed = '1'; el.textContent = '¿Seguro?'; toast(msg); setTimeout(() => { delete el.dataset.armed; el.textContent = 'Borrar'; }, 3000); return false; }
document.addEventListener('change', e => {
  if (e.target.id === 'day') { S.date = e.target.value > today() ? today() : (e.target.value || today()); render(); }
});
document.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('extras') && S.tab === 'hoy') S.extrasOpen = e.target.open; }, true);
document.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'authForm') {
    const msg = $('#authMsg'); msg.textContent = 'Entrando…';
    const {error} = await SB.auth.signInWithPassword({email: $('#a-email').value.trim(), password: $('#a-pass').value});
    msg.textContent = error ? 'No se ha podido entrar: ' + error.message : ''; return;
  }
  const fd = new FormData(f), v = k => (fd.get(k) || '').toString().trim();
  switch (f.dataset.form) {
    case 'task-add': { const t = v('t'); if (!t) return; const id = uid(); put('task', id, {id, date: f.dataset.d, title: t, done: false}); render(); break; }
    case 'task': { const t = S.items.task[f.dataset.id]; put('task', t.id, Object.assign({}, t, {title: v('title'), date: v('date') || t.date})); closeSheet(); render(); break; }
    case 'habit-day': { const h = S.items.habit[f.dataset.h], d = f.dataset.d, id = h.id + '_' + d, st = v('status'), note = v('note'), cnt = +v('count') || 1;
      if (!st && !note) del('log', id); else put('log', id, {habit: h.id, date: d, status: st, count: cnt, note}); closeSheet(); render(); break; }
    case 'habit': { const id = f.dataset.h || uid(), old = S.items.habit[id] || {order: 50};
      const b = Object.assign({}, old, {id, name: v('name'), detail: v('detail'), focus: v('focus') || null, freq: v('freq'), target: Math.max(1, +v('target') || 1), min: Math.max(0, +v('min')), core: fd.get('core') === 'on',
        goal: v('goal') || null, minLoad: v('minLoad') === '' ? null : Math.max(0, +v('minLoad')), from: v('from') || today(), to: v('to') || null, source: fd.get('cuaderno') === 'on' ? 'cuaderno' : 'manual', multi: fd.get('multi') === 'on', paused: fd.get('paused') === 'on', days: old.days || ALL_DAYS});
      if (!b.core) b.min = b.target; else b.min = Math.min(b.min || b.target, b.target);
      put('habit', id, b); closeSheet(); render(); break; }
    case 'goal': { const id = f.dataset.g || uid(), old = S.items.goal[id] || {milestones: [], order: 30};
      const b = Object.assign({}, old, {id, title: v('title'), due: v('due') || null, why: v('why'), note: v('note'), big: fd.get('big') === 'on', parent: v('parent') || null, done: fd.get('done') === 'on'});
      if (fd.has('ms')) { const prev = old.milestones || []; b.milestones = v('ms').split('\n').map(x => x.trim()).filter(Boolean).map(line => { const ent = /^\*\s*/.test(line); const [t, d] = line.replace(/^\*\s*/, '').split('|').map(s => s.trim()); const p = prev.find(m => m.title === t) || {}; return {title: t, due: /^\d{4}-\d{2}-\d{2}$/.test(d || '') ? d : null, done: !!p.done, doneAt: p.doneAt || null, entrega: ent}; }); }
      put('goal', id, b); closeSheet(); render(); break; }
    case 'review': { const rw = S.statsWeek; put('review', rw, {week: rw, answers: REVIEW_Q.map((_, i) => v('a' + i)), savedAt: new Date().toISOString()}); toast('Revisión guardada.'); render(); break; }
  }
});
window.addEventListener('focus', () => { const t = today(); if (S.lastDay && S.lastDay !== t) { S.date = t; S.week = monOf(t); S.statsWeek = monOf(t); render(); } S.lastDay = t; });
S.lastDay = today();
init();
</script>
